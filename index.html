<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>William</title>
<meta name="description" content="Chat with William.">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="William">
<link rel="icon" href="avatar.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="avatar.svg">
<script>try{var t=localStorage.getItem("william-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="who">
      <div class="avatar"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="64" height="64" rx="20" fill="var(--av-bg)"/><path d="M17.5 23 L24.6 42 L32 29.5 L39.4 42 L46.5 23" fill="none" stroke="var(--av-fg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="meta"><h1>William</h1><p class="status" id="status">online</p></div>
    </div>
    <div class="actions">
      <button class="icon" id="themeBtn" type="button" aria-label="Change theme" title="Theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M12 3.75a8.25 8.25 0 0 1 0 16.5z" fill="currentColor"/></svg>
      </button>
      <button class="icon" id="newBtn" type="button" aria-label="Start a new chat" title="New chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.5H7.5a3 3 0 0 0-3 3v9a3 3 0 0 0 3 3h9a3 3 0 0 0 3-3V13" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/><path d="M17.6 3.9a1.9 1.9 0 0 1 2.7 2.7l-7.4 7.4-3.4.7.7-3.4z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main class="chat" id="chat" aria-live="polite">
    <section class="welcome" id="welcome">
      <div class="big-avatar"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="64" height="64" rx="20" fill="var(--av-bg)"/><path d="M17.5 23 L24.6 42 L32 29.5 L39.4 42 L46.5 23" fill="none" stroke="var(--av-fg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h2>Ask William anything.</h2>
      <p>Homework, ideas, advice, or just a second opinion. He explains things properly.</p>
    </section>
    <div id="messages" class="messages"></div>
  </main>

  <div class="chips" id="chips">
    <button class="chip" type="button" data-q="Explain how black holes work"><b>Explain</b><span>how black holes work</span></button>
    <button class="chip" type="button" data-q="Help me with my homework"><b>Homework</b><span>walk me through it</span></button>
    <button class="chip" type="button" data-q="Tell me a joke"><b>Joke</b><span>make it a good one</span></button>
    <button class="chip" type="button" data-q="Give me a fun fact I probably don't know"><b>Fun fact</b><span>something I don't know</span></button>
  </div>

  <form class="composer" id="form" autocomplete="off">
    <div class="field">
      <textarea id="input" rows="1" placeholder="Message William" aria-label="Message William" enterkeyhint="send"></textarea>
      <button id="send" class="send" type="submit" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18.5V6M6.5 11.5 12 6l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </form>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <h3 id="sheetTitle">Theme</h3>
    <div class="themes" id="themes"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
